<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MyWajarScope" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1460"/><stop offset=".55" stop-color="#3730A3"/><stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE047"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="224" cy="224" r="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Jalur Gemilang-inspired stripes, very subtle, inside the lens -->
  <g clip-path="url(#lens)" opacity=".16">
    <rect x="100" y="112" width="250" height="18" fill="#fff"/><rect x="100" y="148" width="250" height="18" fill="#fff"/>
    <rect x="100" y="184" width="250" height="18" fill="#fff"/><rect x="100" y="220" width="250" height="18" fill="#fff"/>
    <rect x="100" y="256" width="250" height="18" fill="#fff"/><rect x="100" y="292" width="250" height="18" fill="#fff"/>
  </g>
  <!-- rising data bars = district insight -->
  <g fill="#fff">
    <rect x="158" y="236" width="34" height="62" rx="9"/>
    <rect x="207" y="196" width="34" height="102" rx="9"/>
    <rect x="256" y="160" width="34" height="138" rx="9"/>
  </g>
  <!-- hibiscus-red focus point (the district that needs action) -->
  
  <!-- scope lens + handle in Malaysian yellow -->
  <circle cx="224" cy="224" r="128" fill="none" stroke="url(#gold)" stroke-width="30"/>
  <path d="M318 318 L404 404" stroke="url(#gold)" stroke-width="44" stroke-linecap="round"/>
    <circle cx="273" cy="134" r="15" fill="#EF4444" stroke="#fff" stroke-width="5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
